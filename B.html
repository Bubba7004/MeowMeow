<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wire — Chat</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#161923;
    --panel-2:#1d212e;
    --border:#272c3a;
    --text:#eef0f5;
    --text-dim:#8b91a5;
    --accent:#5b8cff;
    --accent-2:#8a5bff;
    --danger:#ff5b6e;
    --success:#37d18c;
    --bubble-out:linear-gradient(135deg,#5b8cff,#8a5bff);
    --bubble-in:#232838;
    --radius:14px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  [data-theme="light"]{
    --bg:#eef0f5;
    --panel:#ffffff;
    --panel-2:#f5f6fa;
    --border:#e1e4ee;
    --text:#1b1d27;
    --text-dim:#6b7086;
    --bubble-in:#eef0f5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--accent);color:#fff;}

  /* ---------- Auth ---------- */
  #auth-screen{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(91,140,255,.18), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(138,91,255,.18), transparent 40%),
      var(--bg);
  }
  .auth-card{
    width:380px;
    max-width:92vw;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:36px 32px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .auth-logo{
    width:44px;height:44px;border-radius:12px;
    background:var(--bubble-out);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#fff;font-size:20px;margin-bottom:18px;
  }
  .auth-card h1{font-size:22px;font-weight:600;margin-bottom:4px;}
  .auth-card p.sub{color:var(--text-dim);font-size:13.5px;margin-bottom:22px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 13px;border-radius:10px;
    border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);font-size:14px;outline:none;
    transition:border-color .15s;
  }
  .field input:focus{border-color:var(--accent);}
  .primary-btn{
    width:100%;padding:12px;border:none;border-radius:10px;
    background:var(--bubble-out);color:#fff;font-weight:600;font-size:14.5px;
    margin-top:6px;transition:opacity .15s, transform .1s;
  }
  .primary-btn:hover{opacity:.92;}
  .primary-btn:active{transform:scale(.98);}
  .primary-btn:disabled{opacity:.5;cursor:not-allowed;}
  .link-btn{
    display:block;width:100%;text-align:center;background:none;border:none;
    color:var(--text-dim);font-size:13px;margin-top:16px;
  }
  .link-btn:hover{color:var(--accent);}
  .auth-error{
    color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px;
  }

  /* ---------- App shell ---------- */
  #app-screen{display:none;height:100vh;}
  .app-grid{
    display:grid;
    grid-template-columns:320px 1fr;
    grid-template-rows:100vh;
    height:100vh;
  }
  .sidebar{
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    min-width:0;
  }
  .sidebar-top{
    padding:16px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--border);
  }
  .avatar{
    width:40px;height:40px;border-radius:50%;
    background:var(--panel-2);object-fit:cover;flex-shrink:0;
    border:1px solid var(--border);
  }
  .avatar-sm{width:30px;height:30px;}
  .avatar-lg{width:84px;height:84px;}
  .me-name{font-weight:600;font-size:14.5px;}
  .me-username{font-size:12px;color:var(--text-dim);}
  .icon-btn{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);display:flex;align-items:center;
    justify-content:center;font-size:15px;flex-shrink:0;transition:background .15s;
  }
  .icon-btn:hover{background:var(--border);}
  .top-actions{margin-left:auto;display:flex;gap:6px;}

  .tabs{display:flex;border-bottom:1px solid var(--border);}
  .tab{
    flex:1;padding:11px 4px;text-align:center;font-size:12.5px;font-weight:600;
    color:var(--text-dim);background:none;border:none;position:relative;
  }
  .tab.active{color:var(--accent);}
  .tab.active::after{
    content:"";position:absolute;bottom:-1px;left:20%;right:20%;height:2px;
    background:var(--accent);border-radius:2px;
  }
  .tab .badge{
    background:var(--danger);color:#fff;font-size:10px;border-radius:8px;
    padding:1px 5px;margin-left:4px;
  }

  .search-wrap{padding:10px 14px;}
  .search-wrap input{
    width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);font-size:13px;outline:none;
  }

  .list{flex:1;overflow-y:auto;padding:4px 8px;}
  .list::-webkit-scrollbar{width:6px;}
  .list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  .row{
    display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px;
    cursor:pointer;transition:background .12s;position:relative;
  }
  .row:hover{background:var(--panel-2);}
  .row.active{background:var(--panel-2);}
  .row-main{min-width:0;flex:1;}
  .row-title{font-size:13.8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-meta{font-size:10.5px;color:var(--text-dim);flex-shrink:0;}
  .dot{
    width:9px;height:9px;border-radius:50%;background:var(--text-dim);
    position:absolute;left:33px;top:32px;border:2px solid var(--panel);
  }
  .dot.online{background:var(--success);}
  .empty-state{
    color:var(--text-dim);font-size:13px;text-align:center;padding:40px 20px;
  }
  .req-actions{display:flex;gap:6px;}
  .req-actions button{
    border:none;border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:600;
  }
  .accept-btn{background:var(--success);color:#08201a;}
  .decline-btn{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border) !important;}
  .add-btn{
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:6px 12px;font-size:11.5px;font-weight:600;
  }
  .add-btn:disabled{background:var(--panel-2);color:var(--text-dim);}

  /* ---------- Chat area ---------- */
  .chat-area{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);}
  .chat-placeholder{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--text-dim);gap:8px;
  }
  .chat-placeholder .big-emoji{font-size:44px;opacity:.6;}
  .chat-header{
    display:flex;align-items:center;gap:12px;padding:13px 20px;
    border-bottom:1px solid var(--border);background:var(--panel);
  }
  .chat-header .info{min-width:0;}
  .chat-header .name{font-weight:600;font-size:14.5px;}
  .chat-header .status{font-size:12px;color:var(--text-dim);}
  .call-actions{margin-left:auto;display:flex;gap:8px;}

  .messages{
    flex:1;min-height:0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;
  }
  .messages::-webkit-scrollbar{width:6px;}
  .messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .day-sep{
    align-self:center;font-size:11px;color:var(--text-dim);background:var(--panel);
    padding:3px 10px;border-radius:20px;margin:6px 0;
  }
  .bubble-row{display:flex;flex-direction:column;max-width:62%;}
  .bubble-row.out{align-self:flex-end;align-items:flex-end;}
  .bubble-row.in{align-self:flex-start;align-items:flex-start;}
  .bubble{
    padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.4;
    word-break:break-word;
  }
  .bubble-row.out .bubble{background:var(--bubble-out);color:#fff;border-bottom-right-radius:5px;}
  .bubble-row.in .bubble{background:var(--bubble-in);color:var(--text);border-bottom-left-radius:5px;}
  .bubble img, .bubble video{max-width:260px;border-radius:12px;display:block;}
  .msg-time{font-size:10px;color:var(--text-dim);margin-top:3px;padding:0 4px;}
  .typing-row{font-size:12px;color:var(--text-dim);padding-left:4px;font-style:italic;}

  .composer{
    display:flex;align-items:flex-end;gap:8px;padding:14px 18px;
    border-top:1px solid var(--border);background:var(--panel);
    position:relative;
  }
  .composer textarea{
    flex:1;resize:none;max-height:120px;padding:10px 14px;border-radius:14px;
    border:1px solid var(--border);background:var(--panel-2);color:var(--text);
    font-size:14px;outline:none;line-height:1.4;
  }
  .composer textarea:focus{border-color:var(--accent);}
  .send-btn{
    width:40px;height:40px;border-radius:50%;border:none;background:var(--bubble-out);
    color:#fff;font-size:16px;flex-shrink:0;
  }
  .send-btn:disabled{opacity:.4;}
  .emoji-panel{
    position:absolute;bottom:64px;left:18px;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;padding:10px;
    display:none;grid-template-columns:repeat(8,1fr);gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.3);
    z-index:5;
  }
  .emoji-panel.show{display:grid;}
  .emoji-panel span{font-size:19px;text-align:center;padding:4px;border-radius:6px;cursor:pointer;}
  .emoji-panel span:hover{background:var(--panel-2);}

  /* ---------- Modals ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:center;justify-content:center;z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:18px;
    padding:26px;width:380px;max-width:90vw;
  }
  .modal h3{font-size:16px;margin-bottom:14px;}
  .modal .close-row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .ghost-btn{
    background:none;border:1px solid var(--border);color:var(--text);
    padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;
  }
  .profile-pic-picker{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:16px;}
  .file-btn{
    font-size:12px;color:var(--accent);background:none;border:none;
  }

  /* ---------- Call overlay ---------- */
  #call-overlay{
    position:fixed;inset:0;background:#05060a;display:none;
    flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff;
  }
  #call-overlay.show{display:flex;}
  .call-videos{position:relative;width:100%;height:100%;}
  #remote-video{width:100%;height:100%;object-fit:cover;background:#0b0d13;}
  #local-video{
    position:absolute;bottom:110px;right:24px;width:180px;height:130px;
    border-radius:14px;object-fit:cover;border:2px solid rgba(255,255,255,.2);
    background:#0b0d13;
  }
  .call-info{
    position:absolute;top:30px;left:0;right:0;text-align:center;
  }
  .call-info .name{font-size:20px;font-weight:600;}
  .call-info .status{font-size:13px;color:#c3c7d6;margin-top:4px;}
  .call-controls{
    position:absolute;bottom:28px;left:0;right:0;display:flex;justify-content:center;gap:16px;
  }
  .call-btn{
    width:54px;height:54px;border-radius:50%;border:none;font-size:20px;
    display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);color:#fff;
  }
  .call-btn.active-off{background:#fff;color:#111;}
  .call-btn.end{background:var(--danger);}
  .audio-only-avatar{width:130px;height:130px;border-radius:50%;margin-bottom:14px;}

  #incoming-call-toast{
    position:fixed;top:20px;right:20px;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:16px;width:280px;box-shadow:0 20px 50px rgba(0,0,0,.4);
    display:none;z-index:90;
  }
  #incoming-call-toast.show{display:block;}
  .toast-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .toast-actions{display:flex;gap:8px;}
  .toast-actions button{flex:1;border:none;border-radius:9px;padding:9px;font-weight:600;font-size:13px;}

  .toast-notif{
    position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:12px 16px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);
    display:none;z-index:80;
  }
  .toast-notif.show{display:block;}

  @media (max-width:760px){
    .app-grid{grid-template-columns:1fr;}
    .sidebar{position:absolute;inset:0;z-index:10;transition:transform .2s;}
    .sidebar.hide-mobile{transform:translateX(-100%);}
    .chat-area{width:100%;}
    #local-video{width:110px;height:80px;bottom:100px;right:14px;}
  }
</style>
</head>
<body data-theme="dark">

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">W</div>
    <h1 id="auth-title">Welcome back</h1>
    <p class="sub" id="auth-sub">Log in to keep chatting.</p>

    <div class="field" id="username-field" style="display:none;">
      <label>Username</label>
      <input type="text" id="signup-username" placeholder="e.g. alexrivera" autocomplete="off">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="••••••••">
    </div>
    <button class="primary-btn" id="auth-submit-btn">Log In</button>
    <div class="auth-error" id="auth-error"></div>
    <button class="link-btn" id="auth-toggle-btn">Need an account? Sign up</button>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app-screen">
  <div class="app-grid">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <img class="avatar" id="my-avatar" src="" alt="">
        <div class="row-main">
          <div class="me-name" id="my-name">—</div>
          <div class="me-username" id="my-username-display">—</div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="theme-toggle" title="Toggle theme">🌙</button>
          <button class="icon-btn" id="profile-btn" title="Edit profile">✎</button>
          <button class="icon-btn" id="logout-btn" title="Log out">⎋</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="chats">Chats</button>
        <button class="tab" data-tab="friends">Friends</button>
        <button class="tab" data-tab="requests">Requests<span class="badge" id="req-badge" style="display:none;">0</span></button>
        <button class="tab" data-tab="find">Find</button>
      </div>

      <div class="search-wrap" id="find-search-wrap" style="display:none;">
        <input type="text" id="find-input" placeholder="Search by username...">
      </div>

      <div class="list" id="chats-list"></div>
      <div class="list" id="friends-list" style="display:none;"></div>
      <div class="list" id="requests-list" style="display:none;"></div>
      <div class="list" id="find-list" style="display:none;"></div>
    </div>

    <!-- Chat area -->
    <div class="chat-area">
      <div class="chat-placeholder" id="chat-placeholder">
        <div class="big-emoji">💬</div>
        <div>Select a friend to start chatting</div>
      </div>

      <div id="chat-open" style="display:none;flex-direction:column;height:100%;min-height:0;">
        <div class="chat-header">
          <img class="avatar" id="chat-header-avatar" src="">
          <div class="info">
            <div class="name" id="chat-header-name">—</div>
            <div class="status" id="chat-header-status">—</div>
          </div>
          <div class="call-actions">
            <button class="icon-btn" id="voice-call-btn" title="Voice call">📞</button>
            <button class="icon-btn" id="video-call-btn" title="Video call">🎥</button>
            <button class="icon-btn" id="unfriend-btn" title="Remove friend">🗑</button>
          </div>
        </div>

        <div class="messages" id="messages"></div>
        <div class="typing-row" id="typing-indicator" style="display:none;padding:0 20px;"></div>

        <div class="composer">
          <button class="icon-btn" id="emoji-btn">🙂</button>
          <button class="icon-btn" id="image-btn" title="Send photo">🖼</button>
          <button class="icon-btn" id="video-btn" title="Send video">🎬</button>
          <button class="icon-btn" id="gif-btn" title="Send GIF (by URL)">GIF</button>
          <input type="file" id="image-input" accept="image/*" style="display:none;">
          <input type="file" id="video-input" accept="video/*" style="display:none;">
          <textarea id="message-input" rows="1" placeholder="Type a message..."></textarea>
          <button class="send-btn" id="send-btn">➤</button>
          <div class="emoji-panel" id="emoji-panel"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ PROFILE MODAL ============ -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal">
    <h3>Edit profile</h3>
    <div class="profile-pic-picker">
      <img class="avatar avatar-lg" id="profile-modal-avatar" src="">
      <input type="file" id="profile-pic-input" accept="image/*" style="display:none;">
      <button class="file-btn" id="profile-pic-btn">Change photo</button>
    </div>
    <div class="field">
      <label>Display name</label>
      <input type="text" id="profile-displayname" placeholder="Your name">
    </div>
    <div class="field">
      <label>Bio</label>
      <input type="text" id="profile-bio" placeholder="Say something about yourself">
    </div>
    <div class="close-row">
      <button class="ghost-btn" id="profile-cancel-btn">Cancel</button>
      <button class="primary-btn" id="profile-save-btn" style="width:auto;">Save</button>
    </div>
  </div>
</div>

<!-- ============ GIF URL MODAL ============ -->
<div class="modal-overlay" id="gif-modal">
  <div class="modal">
    <h3>Send a GIF</h3>
    <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px;">
      Paste a direct GIF link (e.g. from Giphy or Tenor — right-click a GIF and "copy image address").
    </p>
    <div class="field">
      <input type="text" id="gif-url-input" placeholder="https://media.giphy.com/....gif">
    </div>
    <div class="close-row">
      <button class="ghost-btn" id="gif-cancel-btn">Cancel</button>
      <button class="primary-btn" id="gif-send-btn" style="width:auto;">Send</button>
    </div>
  </div>
</div>

<!-- ============ CALL OVERLAY ============ -->
<div id="call-overlay">
  <div class="call-videos">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
  </div>
  <div class="call-info">
    <div class="name" id="call-peer-name">—</div>
    <div class="status" id="call-status">Calling...</div>
  </div>
  <div class="call-controls">
    <button class="call-btn" id="toggle-mic-btn">🎤</button>
    <button class="call-btn" id="toggle-cam-btn">🎥</button>
    <button class="call-btn end" id="end-call-btn">⏹</button>
  </div>
</div>

<!-- ============ INCOMING CALL TOAST ============ -->
<div id="incoming-call-toast">
  <div class="toast-row">
    <img class="avatar" id="incoming-avatar" src="">
    <div>
      <div style="font-weight:600;font-size:14px;" id="incoming-name">—</div>
      <div style="font-size:12px;color:var(--text-dim);" id="incoming-type">Incoming call</div>
    </div>
  </div>
  <div class="toast-actions">
    <button class="decline-btn" style="border:1px solid var(--border);" id="decline-call-btn">Decline</button>
    <button class="accept-btn" id="accept-call-btn">Accept</button>
  </div>
</div>

<div class="toast-notif" id="toast-notif"></div>

<script type="module">

import {

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
  getDatabase, ref, set, get, push, update, remove, onValue, onChildAdded,
  onChildRemoved, serverTimestamp, query, orderByChild, equalTo, onDisconnect, off
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbFxG2rG2zuN_nOw8YyX3dUrLoTjeIfRc",
  authDomain: "messenger-alternative.firebaseapp.com",
  databaseURL: "https://messenger-alternative-default-rtdb.firebaseio.com",

// --- Cloudinary (used instead of Firebase Storage to avoid cross-origin upload issues) ---
// Fill these in with your own Cloudinary cloud name and UNSIGNED upload preset.
const CLOUDINARY_CLOUD_NAME = 'xayz2dka';
const CLOUDINARY_UPLOAD_PRESET = 'preset';

async function uploadToCloudinary(file, resourceType) {
  if (CLOUDINARY_CLOUD_NAME === 'YOUR_CLOUD_NAME') {
    throw new Error('Cloudinary is not configured yet — set CLOUDINARY_CLOUD_NAME and CLOUDINARY_UPLOAD_PRESET.');
  }
  const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(url, { method: 'POST', body: formData });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    throw new Error(errBody.error?.message || `Upload failed (${res.status})`);
  }
  const data = await res.json();
  return data.secure_url;
}

function showToast(msg) {

function defaultAvatar(seed) {
  const colors = ['5b8cff','8a5bff','37d18c','ff9f5b','ff5b6e','5bd1c8'];
  const c = colors[Math.abs(hashCode(seed || 'x')) % colors.length];
  return `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(seed||'?')}&backgroundColor=${c}`;
}
function hashCode(str){let h=0;for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i);h|=0;}return h;}
function formatTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

$('auth-toggle-btn').onclick = () => {

$('auth-submit-btn').onclick = async () => {
  const email = $('auth-email').value.trim();
  const password = $('auth-password').value;
  const errEl = $('auth-error');
  errEl.innerText = '';

  if (!email || !password) { errEl.innerText = 'Please fill in all fields.'; return; }

  $('auth-submit-btn').disabled = true;
  try {
    if (isSignUp) {
      const usernameRaw = $('signup-username').value.trim();
      const username = usernameRaw.toLowerCase();
      if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        errEl.innerText = 'Username must be 3-20 chars: letters, numbers, underscore.';
        $('auth-submit-btn').disabled = false;
        return;
      }
      const existing = await get(ref(db, 'usernames/' + username));
      if (existing.exists()) {
        errEl.innerText = 'That username is taken.';
        $('auth-submit-btn').disabled = false;
        return;
      }
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      const uid = cred.user.uid;
      const profile = {
        username: usernameRaw,
        usernameLower: username,
        email,
        photoURL: defaultAvatar(usernameRaw),
        bio: '',
        createdAt: Date.now(),
        online: true
      };
      await set(ref(db, 'users/' + uid), profile);
      await set(ref(db, 'usernames/' + username), uid);
      appEntered = true;
      await enterApp(cred.user, profile);
    } else {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const snap = await get(ref(db, 'users/' + cred.user.uid));
      if (snap.exists()) {
        appEntered = true;
        await enterApp(cred.user, snap.val());
      }
      // if the profile isn't there yet for some reason, onAuthStateChanged below will retry
    }
  } catch (e) {
    errEl.innerText = e.message.replace('Firebase: ', '');
  }
  $('auth-submit-btn').disabled = false;
};

async function enterApp(user, profile) {
  currentUser = user;
  myProfile = profile;

  $('auth-screen').style.display = 'none';
  $('app-screen').style.display = 'block';
  $('my-avatar').src = myProfile.photoURL || defaultAvatar(myProfile.username);
  $('my-name').innerText = myProfile.username;
  $('my-username-display').innerText = '@' + myProfile.usernameLower;

  // presence
  const myStatusRef = ref(db, 'users/' + user.uid);
  onDisconnect(myStatusRef).update({ online: false, lastSeen: serverTimestamp() });
  update(myStatusRef, { online: true });

  listenFriends();
  listenRequests();
  listenChats();
  listenIncomingCalls();
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    if (appEntered) return; // already handled directly by the login/signup click above
    // Covers page refresh / any case where the click handler didn't finish the job.
    // Profile write can lag slightly behind auth creation, so retry briefly instead of giving up.
    let snap = await get(ref(db, 'users/' + user.uid));
    let tries = 0;
    while (!snap.exists() && tries < 15) {
      await new Promise(r => setTimeout(r, 300));
      snap = await get(ref(db, 'users/' + user.uid));
      tries++;
    }
    if (!snap.exists()) return;
    appEntered = true;
    await enterApp(user, snap.val());
  } else {
    appEntered = false;
    currentUser = null;
    myProfile = null;
    $('auth-screen').style.display = 'flex';
    $('app-screen').style.display = 'none';
    closeOpenChat();
  }
});

function listenFriends() {
  const friendsRef = ref(db, 'friends/' + currentUser.uid);
  onValue(friendsRef, async (snap) => {
    const uids = snap.exists() ? Object.keys(snap.val()) : [];
    friendsCache = {};
    const list = $('friends-list');
    list.innerHTML = '';
    if (uids.length === 0) {
      list.innerHTML = '<div class="empty-state">No friends yet. Use "Find" to add some!</div>';
    }
    for (const uid of uids) {
      const uSnap = await get(ref(db, 'users/' + uid));

      const u = uSnap.val();
      friendsCache[uid] = u;

        </div>`;
      row.onclick = () => openChat(uid, u);
      list.appendChild(row);
    }
    renderChatsList();
  });
}

let findDebounce = null;
$('find-input').addEventListener('input', () => {
  clearTimeout(findDebounce);
  findDebounce = setTimeout(runFindSearch, 300);
});
async function runFindSearch() {
  const term = $('find-input').value.trim().toLowerCase();
  const list = $('find-list');
  list.innerHTML = '';
  if (!term) { list.innerHTML = '<div class="empty-state">Type a username to search.</div>'; return; }

  const usersSnap = await get(ref(db, 'users'));
  if (!usersSnap.exists()) return;
  const all = usersSnap.val();
  const matches = Object.entries(all).filter(([uid, u]) =>
    uid !== currentUser.uid && u.usernameLower && u.usernameLower.includes(term)
  ).slice(0, 20);

  if (matches.length === 0) {
    list.innerHTML = '<div class="empty-state">No users found.</div>';
    return;
  }

  const [friendsSnap, sentSnap, receivedSnap] = await Promise.all([
    get(ref(db, 'friends/' + currentUser.uid)),
    get(ref(db, 'sentRequests/' + currentUser.uid)),
    get(ref(db, 'friendRequests/' + currentUser.uid)),
  ]);
  const friendUids = friendsSnap.exists() ? Object.keys(friendsSnap.val()) : [];
  const sentUids = sentSnap.exists() ? Object.keys(sentSnap.val()) : [];
  const receivedUids = receivedSnap.exists() ? Object.keys(receivedSnap.val()) : [];

  matches.forEach(([uid, u]) => {
    const row = document.createElement('div');
    row.className = 'row';
    let actionHtml;
    if (friendUids.includes(uid)) actionHtml = `<button class="add-btn" disabled>Friends</button>`;
    else if (sentUids.includes(uid)) actionHtml = `<button class="add-btn" disabled>Requested</button>`;
    else if (receivedUids.includes(uid)) actionHtml = `<button class="add-btn" data-accept="1">Accept</button>`;
    else actionHtml = `<button class="add-btn">Add</button>`;

    row.innerHTML = `
      <img class="avatar" src="${esc(u.photoURL || defaultAvatar(u.username))}">
      <div class="row-main">
        <div class="row-title">${esc(u.username)}</div>
        <div class="row-sub">${esc(u.bio || '@' + u.usernameLower)}</div>
      </div>`;
    const btn = document.createElement('div');
    btn.innerHTML = actionHtml;
    row.appendChild(btn.firstChild);

    row.querySelector('button')?.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (e.target.disabled) return;
      if (e.target.dataset.accept) {
        await set(ref(db, `friends/${currentUser.uid}/${uid}`), true);
        await set(ref(db, `friends/${uid}/${currentUser.uid}`), true);
        await remove(ref(db, `friendRequests/${currentUser.uid}/${uid}`));
      } else {
        await set(ref(db, `friendRequests/${uid}/${currentUser.uid}`), {
          username: myProfile.username, photoURL: myProfile.photoURL || defaultAvatar(myProfile.username), timestamp: Date.now()
        });
        await set(ref(db, `sentRequests/${currentUser.uid}/${uid}`), true);
        showToast('Friend request sent.');
      }
      runFindSearch();
    });
    list.appendChild(row);
  });
}

/* ---------------- Chat window ---------------- */
function closeOpenChat() {
  if (messagesUnsub) { messagesUnsub(); messagesUnsub = null; }
  if (typingUnsub) { typingUnsub(); typingUnsub = null; }
  openChatUid = null; openChatId = null;
  $('chat-placeholder').style.display = 'flex';
  $('chat-open').style.display = 'none';
}

function openChat(uid, u) {
  if (messagesUnsub) messagesUnsub();
  if (typingUnsub) typingUnsub();
  openChatUid = uid;
  openChatId = chatIdFor(currentUser.uid, uid);
  friendsCache[uid] = u;

  $('chat-placeholder').style.display = 'none';
  $('chat-open').style.display = 'flex';
  $('chat-header-avatar').src = u.photoURL || defaultAvatar(u.username);
  $('chat-header-name').innerText = u.username;
  $('chat-header-status').innerText = u.online ? 'Online' : 'Offline';
  $('messages').innerHTML = '';
  renderChatsList();

  const msgsRef = ref(db, 'chats/' + openChatId + '/messages');
  messagesUnsub = onChildAdded(msgsRef, (data) => {
    appendMessage(data.val());
  });

  const typingRef = ref(db, `typing/${openChatId}/${uid}`);
  typingUnsub = onValue(typingRef, (snap) => {
    const el = $('typing-indicator');
    if (snap.exists() && snap.val() === true) {
      el.style.display = 'block';
      el.innerText = u.username + ' is typing...';
    } else {
      el.style.display = 'none';
    }
  });

  // keep header status live
  onValue(ref(db, 'users/' + uid), (snap) => {
    if (!snap.exists() || openChatUid !== uid) return;
    const uu = snap.val();
    friendsCache[uid] = uu;
    $('chat-header-status').innerText = uu.online ? 'Online' : 'Offline';
  });
}

let lastDay = null;
function appendMessage(msg) {
  const container = $('messages');
  const day = new Date(msg.timestamp).toDateString();
  if (day !== lastDay) {
    const sep = document.createElement('div');
    sep.className = 'day-sep';
    sep.innerText = day === new Date().toDateString() ? 'Today' : day;
    container.appendChild(sep);
    lastDay = day;
  }
  const row = document.createElement('div');
  row.className = 'bubble-row ' + (msg.senderUid === currentUser.uid ? 'out' : 'in');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (msg.type === 'text') {
    bubble.innerText = msg.content;
  } else if (msg.type === 'image' || msg.type === 'gif') {
    const img = document.createElement('img');
    img.src = msg.content;
    bubble.appendChild(img);
  } else if (msg.type === 'video') {
    const vid = document.createElement('video');
    vid.src = msg.content;
    vid.controls = true;
    bubble.appendChild(vid);
  }
  row.appendChild(bubble);
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.innerText = formatTime(msg.timestamp);
  row.appendChild(time);
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
}

async function sendChatMessage(type, content) {
  if (!openChatId) return;
  const msgsRef = ref(db, 'chats/' + openChatId + '/messages');
  const payload = { senderUid: currentUser.uid, type, content, timestamp: Date.now() };
  await push(msgsRef, payload);

  const preview = type === 'text' ? content : (type === 'image' ? '📷 Photo' : type === 'video' ? '🎬 Video' : '🎞 GIF');
  const now = Date.now();
  await update(ref(db, `userChats/${currentUser.uid}/${openChatId}`), {
    withUid: openChatUid, lastMessagePreview: preview, lastTimestamp: now
  });
  await update(ref(db, `userChats/${openChatUid}/${openChatId}`), {
    withUid: currentUser.uid, lastMessagePreview: preview, lastTimestamp: now
  });
  set(ref(db, `typing/${openChatId}/${currentUser.uid}`), false);
}

};

/* =========================================================
   WEBRTC CALLING
   ========================================================= */
const rtcConfig = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]
};
let pc = null;
let localStream = null;
let currentCallId = null;
let currentCallRole = null; // 'caller' | 'callee'
let micOn = true, camOn = true;
let callCandidateUnsub = null;
let callDocUnsub = null;

function listenIncomingCalls() {
  onValue(ref(db, 'incomingCall/' + currentUser.uid), async (snap) => {
    if (!snap.exists()) { $('incoming-call-toast').classList.remove('show'); return; }
    const data = snap.val();
    if (data.status !== 'ringing') return;

    $('incoming-avatar').src = data.fromPhoto || defaultAvatar(data.fromUsername);
    $('incoming-name').innerText = data.fromUsername;
    $('incoming-type').innerText = 'Incoming ' + data.type + ' call';
    $('incoming-call-toast').classList.add('show');

    $('accept-call-btn').onclick = () => acceptCall(data);
    $('decline-call-btn').onclick = async () => {
      await update(ref(db, 'calls/' + data.callId), { status: 'declined' });
      await remove(ref(db, 'incomingCall/' + currentUser.uid));
      $('incoming-call-toast').classList.remove('show');
    };
  });
}

$('voice-call-btn').onclick = () => startCall('audio');
$('video-call-btn').onclick = () => startCall('video');

async function startCall(type) {
  if (!openChatUid) return;
  const callId = chatIdFor(currentUser.uid, openChatUid) + '_' + Date.now();
  currentCallId = callId;
  currentCallRole = 'caller';

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' });
  } catch (e) {
    showToast('Could not access camera/microphone.');
    return;
  }

  openCallUI(friendsCache[openChatUid], type, 'Calling...');

  pc = new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = (e) => { $('remote-video').srcObject = e.streams[0]; };

  const callerCandidatesRef = ref(db, `calls/${callId}/callerCandidates`);
  pc.onicecandidate = (e) => { if (e.candidate) push(callerCandidatesRef, e.candidate.toJSON()); };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await set(ref(db, 'calls/' + callId), {
    callerUid: currentUser.uid, calleeUid: openChatUid, type, status: 'ringing',
    offer: { type: offer.type, sdp: offer.sdp }
  });
  await set(ref(db, 'incomingCall/' + openChatUid), {
    callId, fromUid: currentUser.uid, fromUsername: myProfile.username,
    fromPhoto: myProfile.photoURL || defaultAvatar(myProfile.username), type, status: 'ringing'
  });

  callDocUnsub = onValue(ref(db, 'calls/' + callId), async (snap) => {
    const data = snap.val();
    if (!data) return;
    if (data.status === 'accepted' && data.answer && pc.currentRemoteDescription === null) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      $('call-status').innerText = 'Connected';
    }
    if (data.status === 'declined' || data.status === 'ended') endCall(false);
  });

  const calleeCandidatesRef = ref(db, `calls/${callId}/calleeCandidates`);
  callCandidateUnsub = onChildAdded(calleeCandidatesRef, (s) => {
    if (pc) pc.addIceCandidate(new RTCIceCandidate(s.val()));
  });
}

async function acceptCall(data) {
  $('incoming-call-toast').classList.remove('show');
  currentCallId = data.callId;
  currentCallRole = 'callee';

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: data.type === 'video' });
  } catch (e) {
    showToast('Could not access camera/microphone.');
    return;
  }

  const caller = friendsCache[data.fromUid] || { username: data.fromUsername, photoURL: data.fromPhoto };
  openCallUI(caller, data.type, 'Connecting...');

  pc = new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = (e) => { $('remote-video').srcObject = e.streams[0]; };

  const calleeCandidatesRef = ref(db, `calls/${data.callId}/calleeCandidates`);
  pc.onicecandidate = (e) => { if (e.candidate) push(calleeCandidatesRef, e.candidate.toJSON()); };

  const callSnap = await get(ref(db, 'calls/' + data.callId));
  const callData = callSnap.val();
  await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await update(ref(db, 'calls/' + data.callId), {
    status: 'accepted', answer: { type: answer.type, sdp: answer.sdp }
  });
  await remove(ref(db, 'incomingCall/' + currentUser.uid));
  $('call-status').innerText = 'Connected';

  const callerCandidatesRef = ref(db, `calls/${data.callId}/callerCandidates`);
  callCandidateUnsub = onChildAdded(callerCandidatesRef, (s) => {
    if (pc) pc.addIceCandidate(new RTCIceCandidate(s.val()));
  });

  callDocUnsub = onValue(ref(db, 'calls/' + data.callId), (snap) => {
    const d = snap.val();
    if (d && (d.status === 'ended')) endCall(false);
  });
}

function openCallUI(peer, type, status) {
  $('call-overlay').classList.add('show');
  $('call-peer-name').innerText = peer.username;
  $('call-status').innerText = status;
  $('local-video').srcObject = localStream;
  $('local-video').style.display = type === 'video' ? 'block' : 'none';
  $('remote-video').style.display = type === 'video' ? 'block' : 'none';
  micOn = true; camOn = type === 'video';
  $('toggle-mic-btn').classList.remove('active-off');
  $('toggle-cam-btn').classList.remove('active-off');
  $('toggle-cam-btn').style.display = type === 'video' ? 'flex' : 'none';
}

$('toggle-mic-btn').onclick = () => {
  micOn = !micOn;
  localStream?.getAudioTracks().forEach(t => t.enabled = micOn);
  $('toggle-mic-btn').classList.toggle('active-off', !micOn);
};
$('toggle-cam-btn').onclick = () => {
  camOn = !camOn;
  localStream?.getVideoTracks().forEach(t => t.enabled = camOn);
  $('toggle-cam-btn').classList.toggle('active-off', !camOn);
};
$('end-call-btn').onclick = () => endCall(true);

async function endCall(notify) {
  if (currentCallId && notify) {
    await update(ref(db, 'calls/' + currentCallId), { status: 'ended' }).catch(()=>{});
  }
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (callCandidateUnsub) { callCandidateUnsub(); callCandidateUnsub = null; }
  if (callDocUnsub) { callDocUnsub(); callDocUnsub = null; }
  $('call-overlay').classList.remove('show');
  currentCallId = null;
  currentCallRole = null;
}
</script>
</body>
